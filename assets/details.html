<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Details | CampusEquip</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
    <a href="/index.html" class="logo">CampusEquip</a>

    <nav class="main-nav">
        <a href="/index.html">Home</a>
        <a href="/equipment.html" class="active">Equipment</a>
    </nav>

    <div class="header-actions">
        <button type="button" id="logoutButton" class="btn btn-outline">
            Logout
        </button>
    </div>
</header>

<main class="details-container">
    <a href="/equipment.html" class="back-link">← Back to Equipment</a>

    <div class="details-card">
        <div class="details-image">
            <img id="equipmentImage" src="" alt="Selected equipment">
        </div>

        <div class="details-info">
            <p id="equipmentCategory" class="eyebrow blue-eyebrow"></p>
            <h1 id="equipmentName">Loading equipment...</h1>
            <p id="equipmentDescription"></p>

            <div class="details-specs">
                <p><strong>College:</strong> <span id="equipmentCollege"></span></p>
                <p><strong>Condition:</strong> <span id="equipmentCondition"></span></p>
                <p><strong>Available Quantity:</strong> <span id="equipmentQuantity"></span></p>
                <p><strong>Status:</strong> <span id="equipmentStatus"></span></p>
            </div>

            <button type="button" id="requestButton" class="btn">
                Request Equipment
            </button>

            <p id="requestMessage" class="request-message" role="status"></p>
        </div>
    </div>
</main>

<footer class="site-footer">
    <p>© 2026 CampusEquip. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
