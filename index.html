<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusEquip – Borrowing Request</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14l4-4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 10l4 4 4-4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  </defs>
</svg>
<header class="site-header">
  <div class="brand-block">
    <img src="wmsu_logo.png" alt="Western Mindanao State University seal" width="78" height="74">
    <div>
      <h1>Western Mindanao State University</h1>
      <p>A Smart Research University by 2040</p>
    </div>
  </div>
</header>

<div class="app">

  <aside class="sidebar">
    <div class="brand"><div class="brand-logo"><svg class="icon" aria-hidden="true"><use href="#i-cap"/></svg></div><span>CampusEquip</span></div>
    <ul class="nav">
      <li><a href="#"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Dashboard</span></a></li>
      <li><a href="#"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span>Browse Equipment</span></a></li>
      <li><a href="#" class="active" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-clipboard"/></svg><span>Borrowing Request</span></a></li>
      <li><a href="#"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg><span>Borrowed Equipment</span></a></li>
      <li><a href="#"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span>Notifications</span></a></li>
      <li><a href="#"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></li>
    </ul>
    <a href="#" class="logout"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg><span>Logout</span></a>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="user">
        <div class="avatar" aria-hidden="true">JD</div>
        <div><strong>Juan Dela Cruz</strong><span>Student</span></div>
      </div>
    </div>

    <section class="card">
      <h2>Borrowing Request</h2>

      <form id="requestForm" novalidate>
        <div class="row">
          <div class="field">
            <label for="equipment">Select Equipment</label>
            <select id="equipment" class="control">
              <option>Laptop</option>
              <option>Projector</option>
              <option>Camera</option>
              <option>Microphone</option>
              <option>Extension Cord</option>
            </select>
          </div>
          <div class="field">
            <label for="qty">Quantity</label>
            <div class="stepper" id="stepper">
              <button type="button" id="minus" aria-label="Decrease quantity">−</button>
              <input id="qty" type="number" min="1" max="10" value="1">
              <button type="button" id="plus" aria-label="Increase quantity">+</button>
            </div>
            <div class="error" id="qtyError"></div>
          </div>
        </div>

        <div class="field full">
          <label for="purpose">Purpose of Borrowing</label>
          <textarea id="purpose" class="control" placeholder="Enter purpose..."></textarea>
          <div class="error" id="purposeError"></div>
        </div>

        <div class="row">
          <div class="field">
            <label for="borrowDate">Borrowing Date</label>
            <input id="borrowDate" type="date" class="control">
            <div class="error" id="borrowError"></div>
          </div>
          <div class="field">
            <label for="returnDate">Return Date</label>
            <input id="returnDate" type="date" class="control">
            <div class="error" id="returnError"></div>
          </div>
        </div>

        <button type="submit" class="submit">Submit Request</button>
        <div class="toast" id="toast" role="status"></div>
      </form>
    </section>
  </main>
</div>

<script>
  const $ = id => document.getElementById(id);
  const qty = $('qty'), purpose = $('purpose'), borrow = $('borrowDate'), ret = $('returnDate');
  const MAX = 10;

  // Default dates: today -> +2 days
  const iso = d => d.toISOString().slice(0, 10);
  const today = new Date();
  borrow.min = iso(today);
  borrow.value = iso(today);
  const plus2 = new Date(today); plus2.setDate(plus2.getDate() + 2);
  ret.value = iso(plus2);
  ret.min = borrow.value;

  borrow.addEventListener('change', () => {
    ret.min = borrow.value;
    if (ret.value < borrow.value) ret.value = borrow.value;
  });

  // Quantity stepper
  const clamp = n => Math.min(MAX, Math.max(1, n || 1));
  $('minus').onclick = () => qty.value = clamp(+qty.value - 1);
  $('plus').onclick  = () => qty.value = clamp(+qty.value + 1);
  qty.addEventListener('change', () => qty.value = clamp(+qty.value));

  // Validation + submit
  function setError(input, errEl, msg) {
    errEl.textContent = msg;
    (input.closest('.stepper') || input).classList.toggle('invalid', !!msg);
    return !msg;
  }

  $('requestForm').addEventListener('submit', e => {
    e.preventDefault();
    const results = [
      setError(qty, $('qtyError'), +qty.value >= 1 ? '' : 'Enter a quantity of at least 1.'),
      setError(purpose, $('purposeError'), purpose.value.trim() ? '' : 'Tell us why you need this equipment.'),
      setError(borrow, $('borrowError'), borrow.value ? '' : 'Choose a borrowing date.'),
      setError(ret, $('returnError'), !ret.value ? 'Choose a return date.' : ret.value < borrow.value ? 'Return date must be on or after the borrowing date.' : '')
    ];
    if (results.includes(false)) return;

    // TODO: replace with a real request, e.g. fetch('/api/borrow-requests', { method: 'POST', ... })
    const data = {
      equipment: $('equipment').value,
      quantity: +qty.value,
      purpose: purpose.value.trim(),
      borrowingDate: borrow.value,
      returnDate: ret.value
    };
    console.log('Borrowing request:', data);

    const toast = $('toast');
    toast.textContent = `Request submitted: ${data.quantity} × ${data.equipment}.`;
    toast.classList.add('show');
    purpose.value = '';
  });

</script>
</body>
</html>
